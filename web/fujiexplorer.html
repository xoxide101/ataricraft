<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FujiNet Explorer - Ataricraft</title>
<style>
  :root{--bg:#14161a;--panel:#1b1f27;--line:#2a2f39;--fg:#d8dce4;--dim:#8f98a8;--acc:#ff9d3a;--bad:#ff6b6b;--good:#6bd68c}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,sans-serif}
  body{display:flex;flex-direction:column}
  button,select,input,textarea{background:#2a2f39;color:var(--fg);border:1px solid #3a4150;border-radius:5px;padding:4px 9px;font:inherit}
  input,textarea{background:#101319}
  button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.on{background:var(--acc);color:#111;border-color:var(--acc)}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;background:#181b21;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0 8px 0 0;color:var(--acc)}
  .chip{padding:2px 9px;border-radius:12px;border:1px solid #3a4150;font-size:12px;color:var(--dim)}
  .chip.ok{color:var(--good);border-color:#2f6b45}.chip.bad{color:var(--bad);border-color:#7a3a3a}.chip.ro{color:#ffd166;border-color:#7a6a2a}
  nav{display:flex;gap:2px;padding:0 10px;background:#181b21;border-bottom:1px solid var(--line)}
  nav button{border-radius:5px 5px 0 0;border-bottom:none;background:transparent;color:var(--dim)}nav button.on{background:var(--bg);color:var(--fg);border-color:var(--line)}
  main{flex:1;min-height:0;display:flex}
  .tab{display:none;flex:1;min-width:0;min-height:0}.tab.show{display:flex}
  #res{width:210px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px;flex:none}
  #res h3{font-size:12px;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
  #res .r{display:block;width:100%;text-align:left;margin:2px 0;border:1px solid transparent;background:transparent;padding:3px 6px}
  #res .r:hover,#res .r.on{background:#2a2f39}
  #res .row{display:flex;gap:4px;margin:3px 0}#res input{min-width:0;flex:1}
  #files{flex:1;min-width:0;display:flex;flex-direction:column}
  #bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
  #path{flex:1;min-width:140px}
  #listwrap{flex:1;overflow:auto;position:relative}#listwrap.drag{outline:3px dashed var(--acc);outline-offset:-6px}
  table.l{width:100%;border-collapse:collapse}table.l td,table.l th{padding:3px 8px;text-align:left;white-space:nowrap}
  table.l tr.f{cursor:default}table.l tr.f:hover{background:#20252e}table.l tr.sel{background:#33405a!important}
  table.l td.n{width:100%;overflow:hidden;text-overflow:ellipsis}table.l td.s{text-align:right;color:var(--dim)}
  #prev{width:380px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px;flex:none}
  #prev pre.txt{white-space:pre-wrap;word-break:break-all;font:12px Consolas,monospace;margin:6px 0;max-height:60vh;overflow:auto}
  #prev .note,.note{color:var(--dim);font-size:12px;margin:4px 0}
  #prev img.pic,#prev canvas.pix{max-width:100%;image-rendering:pixelated;background:#000;border:1px solid var(--line)}
  #prev .acts{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
  .segs td,.segs th{padding:2px 8px;border-bottom:1px solid var(--line)}
  .pane{flex:1;overflow:auto;padding:12px;min-width:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}.card.over{outline:3px dashed var(--acc)}
  .card h4{margin:0 0 4px}.card .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .form{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;max-width:640px;align-items:center}
  .form.wide{max-width:900px}
  h2{font-size:15px;margin:14px 0 6px}
  pre.paper{background:#f4f1e6;color:#222;padding:14px;min-height:240px;font:13px/1.25 Consolas,monospace;border-radius:3px;overflow:auto;white-space:pre}
  pre.out{background:#0d0f12;border:1px solid var(--line);padding:8px;font:12px Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
  #log{height:96px;overflow:auto;border-top:1px solid var(--line);background:#101319;font:11px Consolas,monospace;padding:4px 8px;color:var(--dim);flex:none}
  #log .e{color:var(--bad)}#log .w{color:#ffd166}
  #modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}#modal.show{display:flex}
  #mbox{background:var(--panel);border:1px solid #3a4150;border-radius:8px;padding:16px;min-width:340px;max-width:90vw}
  #mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}#mbox input{width:100%;box-sizing:border-box;margin-top:8px}
  .fontsample{background:#fff;color:#111;padding:10px;border-radius:4px;margin:6px 0}
</style></head><body>
<header>
  <h1>FujiNet Explorer</h1>
  <span class="chip" id="chRelay" title="HTTP link to tools/tnfs-bridge">relay: ?</span>
  <span class="chip" id="chEmu" title="The Ataricraft emulator tab (index.html)">emulator: ?</span>
  <span class="chip" id="chWrite" title="Relay writes need --allow-write">writes: ?</span>
  <span style="flex:1"></span>
  <label class="note">Relay <input id="relayUrl" size="22" placeholder="http://127.0.0.1:8765"></label>
  <label class="note">Token <input id="token" size="14" type="password" placeholder="(filled in by the relay page)"></label>
  <button id="reconnect">Connect</button>
</header>
<nav id="nav"></nav>
<main>
  <section class="tab" id="tab-files">
    <div id="res"></div>
    <div id="files">
      <div id="bar">
        <button id="up" title="Parent folder">&uarr; Up</button><button id="refresh">Refresh</button>
        <input id="path" spellcheck="false">
        <button id="go">Go</button>
        <span style="width:8px"></span>
        <button id="upload">Upload</button><input type="file" id="upfile" multiple hidden>
        <button id="mkdir">New folder</button><button id="rename">Rename</button><button id="delete">Delete</button><button id="download">Download</button>
      </div>
      <div id="listwrap"><table class="l" id="list"></table></div>
    </div>
    <div id="prev"><div class="note">Select a file to preview it.</div></div>
  </section>
  <section class="tab" id="tab-drives"><div class="pane"><div class="note" id="drvnote"></div><div class="cards" id="drives"></div></div></section>
  <section class="tab" id="tab-net"><div class="pane" id="netpane"></div></section>
  <section class="tab" id="tab-printer"><div class="pane" id="prpane"></div></section>
  <section class="tab" id="tab-settings"><div class="pane" id="setpane"></div></section>
  <section class="tab" id="tab-dos"><div class="pane" id="dospane"></div></section>
</main>
<div id="log"></div>
<div id="modal"><div id="mbox"></div></div>
<script>window.AC = window.AC || {};</script>
<script src="js/dosfs.js"></script>
<script src="js/lzh.js"></script>
<script src="js/diskconv.js"></script>
<script src="js/afmcore.js"></script>
<script src="js/transport.js"></script>
<script src="js/fxpreview.js"></script>
<script src="js/fujiexplorer.js"></script>
</body></html>
